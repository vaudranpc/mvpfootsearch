  <style>
    .site-nav {
      background-color: #6d2222;
      padding: 15px;
      text-align: center;
      position: relative;
      z-index: 1000;
    }
    .site-nav-link {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      background: none;
      border: none;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
    }
    .site-nav-link:hover {
      text-decoration: underline;
    }
    .site-dropdown {
      display: inline-block;
      position: relative;
    }
    .site-dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #fff;
      min-width: 200px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 8px;
      text-align: left;
    }
    .site-dropdown-menu.open {
      display: block;
    }
    .site-dropdown-menu a {
      display: block;
      padding: 10px 15px;
      color: #6d2222;
      text-decoration: none;
      white-space: nowrap;
    }
    .site-dropdown-menu a:hover {
      background-color: #f2e4e4;
    }
  </style>

  <script>
    (function () {
      document
        .querySelectorAll(".site-dropdown-toggle")
        .forEach(function (toggle) {
          toggle.addEventListener("click", function (e) {
            e.stopPropagation();
            const menu = toggle.nextElementSibling;
            const isOpen = menu.classList.contains("open");
            document
              .querySelectorAll(".site-dropdown-menu.open")
              .forEach(function (m) {
                m.classList.remove("open");
              });
            if (!isOpen) {
              menu.classList.add("open");
            }
          });
        });
      document.addEventListener("click", function () {
        document
          .querySelectorAll(".site-dropdown-menu.open")
          .forEach(function (m) {
            m.classList.remove("open");
          });
      });
    })();
  </script>

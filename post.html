<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Générateur d'overlay</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Caveat:wght@700&family=DM+Serif+Display:ital@0;1&family=Fredoka:wght@500;700&family=Permanent+Marker&family=Playfair+Display:ital,wght@1,800&family=Poppins:ital,wght@0,700;1,800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#6fd54a;
    --blue:#2b56d6;
    --pink-red:#f0567a;
    --paper:#f4f1ea;
    --ink:#14140f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:#e9e9ef;
  }
  #app-body{
    display:flex;
    min-height:100vh;
  }

  /* ---------- PANNEAU DE CONTRÔLE ---------- */
  #panel{
    width:340px;
    flex-shrink:0;
    background:#1b1b22;
    color:#eee;
    padding:24px 20px;
    overflow-y:auto;
    height:100vh;
    position:sticky;
    top:0;
  }
  #panel h1{
    font-size:18px;
    margin:0 0 4px;
  }
  #panel p.sub{
    font-size:12px;
    color:#9a9aa5;
    margin:0 0 20px;
  }
  #panel label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:#9a9aa5;
    margin:16px 0 6px;
  }
  #panel input[type=text], #panel textarea{
    width:100%;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid #34343f;
    background:#111117;
    color:#fff;
    font-size:14px;
    font-family:inherit;
    resize:vertical;
  }
  #panel textarea{min-height:70px;}
  #panel input[type=color]{
    width:44px;height:28px;border:none;border-radius:6px;background:none;padding:0;cursor:pointer;
    vertical-align:middle;
  }
  .color-row{display:flex;align-items:center;gap:10px;}
  .color-row span{font-size:12px;color:#c7c7d0;}
  #panel select{
    width:100%;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid #34343f;
    background:#111117;
    color:#fff;
    font-size:14px;
    font-family:inherit;
  }
  .range-row{display:flex;align-items:center;gap:10px;}
  .range-row input[type=range]{flex:1;}
  .range-row span{font-size:12px;color:#c7c7d0;min-width:38px;text-align:right;}
  #noteTextInput{min-height:110px;}
  #downloadBtn{
    margin-top:26px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:9px;
    background:var(--blue);
    color:#fff;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  #downloadBtn:hover{background:#1e42ad;}
  hr{border:none;border-top:1px solid #2c2c36;margin:22px 0;}

  /* ---------- ZONE DE PREVIEW ---------- */
  #stage-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    overflow:auto;
  }

  #canvas{
    width:1920px;
    height:1080px;
    transform-origin:center center;
    position:relative;
    background:var(--paper);
    overflow:hidden;
    font-family:'Segoe UI', Arial, sans-serif;
    flex-shrink:0;
  }

  /* confettis de fond (formes simples en CSS) */
  .confetti{
    position:absolute;
    opacity:.9;
  }

  /* --------- panneau vert gauche (rec) --------- */
  #greenPanel{
    position:absolute;
    left:60px; top:80px;
    width:1260px; height:920px;
    background:var(--green);
    border:6px solid var(--blue);
    border-radius:14px;
  }
  #recTag{
    position:absolute;
    left:32px; top:24px;
    background:#fce9e6;
    color:#e2536a;
    font-weight:800;
    font-size:26px;
    padding:8px 18px 8px 14px;
    border-radius:6px;
    display:flex;
    align-items:center;
    gap:8px;
    letter-spacing:.03em;
  }
  #recTag .dot{
    width:14px;height:14px;border-radius:50%;background:#e2536a;
  }
  #closeX{
    position:absolute;
    right:34px; top:24px;
    font-size:34px;
    font-weight:800;
    color:var(--blue);
  }

  /* --------- carte de droite (feuille quadrillée) --------- */
  #noteCard{
    position:absolute;
    right:60px; top:78px;
    width:500px; height:735px;
    background:
      linear-gradient(to right, #dfe3ea 1px, transparent 1px),
      linear-gradient(to bottom, #dfe3ea 1px, transparent 1px),
      #fff;
    background-size:26px 26px;
    border:6px solid var(--blue);
    border-radius:10px;
    padding:30px 34px;
  }
  #sujetTag{
    display:inline-block;
    background:#fff;
    border:3px solid var(--blue);
    color:var(--blue);
    font-weight:800;
    font-size:22px;
    padding:6px 18px;
    border-radius:8px;
    margin-bottom:26px;
    letter-spacing:.03em;
  }
  #noteText{
    font-family:'Poppins', sans-serif;
    font-size:34px;
    font-weight:800;
    font-style:italic;
    line-height:1.22;
    color:#111;
    white-space:pre-wrap;
    word-wrap:break-word;
    text-align:left;
  }

  /* --------- badge du bas (compte) --------- */
  #handleBadge{
    position:absolute;
    right:60px; bottom:40px;
    background:#fff;
    border:5px solid var(--blue);
    border-radius:40px;
    padding:20px 46px 20px 60px;
    font-weight:800;
    font-size:34px;
    color:#e2536a;
    letter-spacing:.02em;
  }
</style>
<script src="header.js"></script>
</head>
<body>

<div id="header-container"></div>
<div id="app-body">
<div id="panel">
  <h1>Générateur d'overlay</h1>
  <p class="sub">Modifie les champs, l'aperçu se met à jour en direct.</p>

  <label for="recLabel">Étiquette (haut gauche)</label>
  <input type="text" id="recLabel" value="REC">

  <label for="sujetLabel">Étiquette "sujet"</label>
  <input type="text" id="sujetLabel" value="SUJET">

  <label for="noteTextInput">Texte du bloc (une seule zone)</label>
  <textarea id="noteTextInput">Top 10 recettes
Comment cuisiner un homard ?

TOUTES NOS ASTUCES POUR CUISINER FACILEMENT !</textarea>

  <label for="fontSelect">Police</label>
  <select id="fontSelect">
    <option value="'Poppins', sans-serif" selected>Poppins — moderne, arrondie</option>
    <option value="'Fredoka', sans-serif">Fredoka — ronde et fun</option>
    <option value="'Anton', sans-serif">Anton — impact, très épaisse</option>
    <option value="'Archivo Black', sans-serif">Archivo Black — carrée, punchy</option>
    <option value="'Bebas Neue', sans-serif">Bebas Neue — condensée, affiche</option>
    <option value="'Space Grotesk', sans-serif">Space Grotesk — geek chic</option>
    <option value="'Playfair Display', serif">Playfair Display — élégante</option>
    <option value="'DM Serif Display', serif">DM Serif Display — éditorial</option>
    <option value="'Caveat', cursive">Caveat — manuscrite</option>
    <option value="'Permanent Marker', cursive">Permanent Marker — feutre</option>
  </select>

  <label for="fontSize">Taille du texte</label>
  <div class="range-row">
    <input type="range" id="fontSize" min="14" max="80" value="34">
    <span id="fontSizeValue">34px</span>
  </div>

  <label for="handle">Nom du compte (bas droite)</label>
  <input type="text" id="handle" value="@canvasupersite">

  <hr>

  <div class="color-row">
    <span>Couleur fond gauche</span>
    <input type="color" id="colGreen" value="#6fd54a">
  </div>
  <div class="color-row" style="margin-top:10px;">
    <span>Couleur des bordures</span>
    <input type="color" id="colBlue" value="#2b56d6">
  </div>
  <div class="color-row" style="margin-top:10px;">
    <span>Couleur des accents (REC / pseudo)</span>
    <input type="color" id="colAccent" value="#e2536a">
  </div>

  <hr>
  <button id="downloadBtn">Télécharger en PNG</button>
</div>

<div id="stage-wrap">
  <div id="canvas">

    <!-- confettis décoratifs -->
    <svg class="confetti" style="left:20px;top:60px;" width="70" height="70"><rect x="10" y="10" width="45" height="45" fill="#2b56d6" transform="rotate(20 32 32)"/></svg>
    <svg class="confetti" style="left:520px;top:10px;" width="60" height="60"><rect x="10" y="10" width="35" height="35" fill="#f0567a" transform="rotate(-15 27 27)"/></svg>
    <svg class="confetti" style="left:900px;top:20px;" width="60" height="60"><polygon points="30,5 55,50 5,50" fill="#f2c94c"/></svg>
    <svg class="confetti" style="left:1280px;top:0;" width="60" height="60"><rect x="10" y="10" width="35" height="35" fill="#f2c94c" transform="rotate(30 27 27)"/></svg>
    <svg class="confetti" style="left:0;top:400px;" width="60" height="60"><polygon points="30,5 55,50 5,50" fill="#f0567a"/></svg>
    <svg class="confetti" style="left:0;top:900px;" width="70" height="70"><rect x="10" y="10" width="40" height="40" fill="#2b56d6" transform="rotate(45 30 30)"/></svg>
    <svg class="confetti" style="left:60px;top:1000px;" width="60" height="60"><ellipse cx="30" cy="30" rx="26" ry="18" fill="#f2c94c" transform="rotate(-10 30 30)"/></svg>
    <svg class="confetti" style="left:1850px;top:350px;" width="50" height="120"><rect x="10" y="0" width="20" height="120" fill="#e8703a" transform="rotate(15 20 60)"/></svg>
    <svg class="confetti" style="left:1830px;top:700px;" width="70" height="70"><rect x="10" y="10" width="40" height="40" fill="#2b56d6" transform="rotate(20 30 30)"/></svg>

    <div id="greenPanel">
      <div id="recTag"><span class="dot"></span><span id="recTagText">REC</span></div>
      <div id="closeX">×</div>
    </div>

    <div id="noteCard">
      <div id="sujetTag">SUJET</div>
      <div id="noteText">Top 10 recettes
Comment cuisiner un homard ?

TOUTES NOS ASTUCES POUR CUISINER FACILEMENT !</div>
    </div>

    <div id="handleBadge">@canvasupersite</div>

  </div>
</div>
</div>

<script>
  const $ = id => document.getElementById(id);

  function bindText(inputId, targetId){
    $(inputId).addEventListener('input', () => {
      $(targetId).textContent = $(inputId).value;
    });
  }

  bindText('recLabel', 'recTagText');
  bindText('sujetLabel', 'sujetTag');
  bindText('handle', 'handleBadge');

  $('noteTextInput').addEventListener('input', () => {
    $('noteText').textContent = $('noteTextInput').value;
  });

  $('fontSelect').addEventListener('change', () => {
    $('noteText').style.fontFamily = $('fontSelect').value;
  });

  $('fontSize').addEventListener('input', () => {
    $('noteText').style.fontSize = $('fontSize').value + 'px';
    $('fontSizeValue').textContent = $('fontSize').value + 'px';
  });

  $('colGreen').addEventListener('input', e=>{
    document.documentElement.style.setProperty('--green', e.target.value);
  });
  $('colBlue').addEventListener('input', e=>{
    document.documentElement.style.setProperty('--blue', e.target.value);
  });
  $('colAccent').addEventListener('input', e=>{
    const c = e.target.value;
    $('recTagText').parentElement.style.color = c;
    $('recTagText').parentElement.querySelector('.dot').style.background = c;
    $('handleBadge').style.color = c;
  });

  // Mise à l'échelle de l'aperçu pour tenir dans la fenêtre
  function fitCanvas(){
    const wrap = document.getElementById('stage-wrap');
    const canvas = document.getElementById('canvas');
    const scale = Math.min(
      (wrap.clientWidth - 40) / 1920,
      (wrap.clientHeight - 40) / 1080
    );
    canvas.style.transform = `scale(${scale})`;
    wrap.style.height = (1080*scale) + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  // Export PNG en pleine résolution (1920x1080), sans le scale appliqué à l'écran
  document.getElementById('downloadBtn').addEventListener('click', () => {
    const canvas = document.getElementById('canvas');
    const originalTransform = canvas.style.transform;
    canvas.style.transform = 'none';
    document.fonts.ready.then(() => {
      html2canvas(canvas, {width:1920, height:1080, scale:1}).then(rendered => {
        canvas.style.transform = originalTransform;
        const link = document.createElement('a');
        link.download = 'overlay.png';
        link.href = rendered.toDataURL('image/png');
        link.click();
      });
    });
  });
</script>

</body>
</html>

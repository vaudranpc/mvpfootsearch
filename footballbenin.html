<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Football Bénin</title>
    <!-- ✅ Bootstrap CSS CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <script src="header.js"></script>
    <link rel="stylesheet" href="x.css" />
  </head>
  <body class="text-center p-4">
    <div id="header-container"></div>
    <h1>MVP Foot Search</h1>
    <h2 class="mb-4">Les pages qui parlent du football Béninois</h2>
    <div
      id="link-container"
      class="d-flex flex-wrap justify-content-center gap-3"
    ></div>
    <div id="footer-container"></div>
    <script>
      const myArray = [
        { nom: "Supras Mag", lien: "https://www.facebook.com/SuprasMag" },
        { nom: "Page Football Bénin 1", lien: "https://www.facebook.com/profile.php?id=61563141370620" },
        { nom: "Serge Serge", lien: "https://www.facebook.com/serge.serge.407140" },
        { nom: "Benco Football", lien: "https://www.facebook.com/benco.football" },
        { nom: "Afropari Bénin", lien: "https://www.facebook.com/Afropari.Benin" },
        { nom: "Page Football Bénin 2", lien: "https://www.facebook.com/profile.php?id=61594238331853" },
        { nom: "Groupe Football Bénin 1", lien: "https://www.facebook.com/groups/1087216829983271/" },
        { nom: "Football Bénin", lien: "https://www.facebook.com/footballbenin" },
        { nom: "Football Bénin 229", lien: "https://www.facebook.com/FootballBenin229" },
        { nom: "Allez les Guépards", lien: "https://www.facebook.com/groups/allezlesguepards/" },
        { nom: "FEBEFOOT Officiel", lien: "https://www.facebook.com/FebefootOfficiel" },
      ];

      const colors = [
        "#e6194b",
        "#3cb44b",
        "#ffe119",
        "#4363d8",
        "#f58231",
        "#911eb4",
        "#46f0f0",
        "#f032e6",
        "#bcf60c",
        "#fabebe",
        "#008080",
        "#317713",
        "#9a6324",
        "#fe45f4",
        "#800000",
        "#8affc3",
        "#808000",
        "#ffd8b1",
        "#000075",
        "#808080",
        "#f34fff",
        "#a9a9a9",
        "#000000",
        "#a52a2a",
        "#7fffd4",
        "#ff69b4",
      ];

      const container = document.getElementById("link-container");

      myArray.forEach(({ nom, lien }) => {
        const firstChar = nom.trim()[0].toLowerCase();
        const alphabetIndex = firstChar.charCodeAt(0) - 97;
        const color =
          alphabetIndex >= 0 && alphabetIndex < 26
            ? colors[alphabetIndex]
            : "#3a350d";

        const link = document.createElement("a");
        link.href = lien;
        link.textContent = nom;
        link.target = "_blank";

        link.className = "btn btn-primary btn-lg";
        link.style.backgroundColor = color;
        link.style.color = color === "#ffffff" ? "#000" : "#fff";
        link.style.border = "none";
        link.style.margin = "5px";

        link.addEventListener("click", function () {
          this.style.backgroundColor = "#333";
          this.style.color = "#fff";
        });

        container.appendChild(link);
      });
    </script>
  </body>
</html>

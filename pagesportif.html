<!doctype html>

            <th>Pages</th>
          </tr>
        </thead>
        <tbody id="link-container"></tbody>
      </table>
    </div>
    <div id="footer-container"></div>
    <script>
      const myArray = [

        {

        {

        },
        { nom: "Stadivoire ", lien: "https://www.facebook.com/Stadivoire" },
        {
          nom: "1er supporteur ivoirien",

        },
        {

          lien: "https://www.facebook.com/Mac2Brignan",
        },

        {
          nom: "PÉPITES FOOTBALL IVOIRIEN ",

        },
        {
          nom: "SOUTIEN AUX ÉLÉPHANTS  ",

        },
        {
          nom: "Emerse Faé - IFCI ",
          lien: "https://www.facebook.com/profile.php?id=61556194437154",
        },
        {

          lien: "https://www.facebook.com/DHSportsTV1",
        },
        {
          nom: "Le Kpakpato Sportif ",
          lien: "https://www.facebook.com/LeKpakpatoSportif",
        },
        {
          nom: "Prodiges du football ivoirien ",
          lien: "https://www.facebook.com/profile.php?id=61565884014836",
        },

        {
          nom: "Actu Foot Ivoire",
          lien: "https://www.facebook.com/profile.php?id=100091316026373",
        },
        { nom: "𝐒𝐏𝐎𝐑𝐓 𝟐𝟐𝟓 ", lien: "https://www.facebook.com/Sport225.ci" },
        { nom: "Séléphanto Football 🇨🇮 ", lien: "https://x.com/Selephanto" },
        {
          nom: "amoureux du foot ivoirien ",
          lien: "https://www.facebook.com/profile.php?id=100083017697974",
        },
        {
          nom: "ULTRAS IVOIRIENS  ",
          lien: "https://www.facebook.com/lesultrasivoiriens",
        },
        { nom: "Foot 225 ", lien: "https://www.facebook.com/LeFoot225" },
        {
          nom: "Élephant cote d'ivoire ",
          lien: "https://www.facebook.com/profile.php?id=61575897533371",
        },
        {
          nom: "Ligue 1 IVOIRIENNE cote d'ivoire ",
          lien: "https://www.facebook.com/laligue1civ",
        },
        {
          nom: "pro du foot ivoirien ",
          lien: "https://www.facebook.com/produfootivoirien",
        },
        {
          nom: "Actus Éléphant Côte d'Ivoire",
          lien: "https://www.facebook.com/profile.php?id=61557357321326",
        },
        {
          nom: "Observatoire Sportif De Côte d'Ivoire - Osci",
          lien: "https://www.facebook.com/OSCI13",
        },
        { nom: "Yannick Tranlait", lien: "https://www.facebook.com/yann.ma.520" },
        { nom: "Magate Officiel", lien: "https://www.facebook.com/magateofficiel" },
        { nom: "Eza Boto", lien: "https://www.facebook.com/eza.boto" },
      ];

      const colors = [
        "#e6194b",
        "#3cb44b",
        "#ffe119",
        "#4363d8",
        "#f58231",
        "#911eb4",
        "#46f0f0",
        "#f032e6",
        "#bcf60c",
        "#fabebe",
        "#008080",
        "#317713",
        "#9a6324",
        "#fe45f4",
        "#800000",
        "#8affc3",
        "#808000",
        "#ffd8b1",
        "#000075",
        "#808080",
        "#f34fff",
        "#a9a9a9",
        "#000000",
        "#a52a2a",
        "#7fffd4",
        "#ff69b4",
      ];

      const container = document.getElementById("link-container");

      // Tri alphabétique (NFKD : "𝐒𝐏𝐎𝐑𝐓 𝟐𝟐𝟓" est classé comme "SPORT 225", accents et majuscules ignorés)
      const sortKey = (nom) => nom.normalize("NFKD").trim();
      myArray.sort((a, b) =>
        sortKey(a.nom).localeCompare(sortKey(b.nom), "fr", { sensitivity: "base", numeric: true })
      );

      // Regroupement par lettre (accents retirés : "É" → "E"), "#" pour chiffres/symboles
      const letterOf = (nom) => {
        const c = sortKey(nom).replace(/[̀-ͯ]/g, "")[0]?.toUpperCase() || "#";
        return /[A-Z]/.test(c) ? c : "#";
      };
      const groups = new Map();
      myArray.forEach((page) => {
        const l = letterOf(page.nom);
        if (!groups.has(l)) groups.set(l, []);
        groups.get(l).push(page);
      });

      groups.forEach((pages, letter) => {
        const idx = letter.charCodeAt(0) - 65;
        const color = idx >= 0 && idx < 26 ? colors[idx] : "#3a350d";
        const row = document.createElement("tr");
        const letterCell = document.createElement("th");
        letterCell.className = "text-center align-middle";
        letterCell.innerHTML = `<span class="badge" style="background:${color};color:#fff;font-size:1.4rem;min-width:48px">${letter}</span>`;
        const linksCell = document.createElement("td");
        row.append(letterCell, linksCell);
        container.appendChild(row);
        pages.forEach((page) => addLink(page, color, linksCell));
      });

      function addLink({ nom, lien }, color, cell) {
        const link = document.createElement("a");
        link.href = lien;
        link.textContent = nom;
        link.target = "_blank";

        link.className = "btn btn-primary btn-lg";
        link.style.backgroundColor = color;
        link.style.color = color === "#ffffff" ? "#000" : "#fff";
        link.style.border = "none";
        link.style.margin = "5px";

        link.addEventListener("click", function () {
          this.style.backgroundColor = "#333";
          this.style.color = "#fff";
        });

        cell.appendChild(link);
      }
    </script>
  </body>
</html>

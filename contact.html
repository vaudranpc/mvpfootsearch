<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Générateur de citation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Fredoka:wght@600;700&family=Inter:wght@700;800;900&family=Montserrat:wght@700;800;900&family=Poppins:wght@700;800;900&family=Space+Grotesk:wght@700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --text:#ffffff;
    --hl-bg:#ffffff;
    --hl-text:#000000;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:#e9e9ef;
    display:flex;
    min-height:100vh;
  }

  /* ---------- PANNEAU DE CONTRÔLE ---------- */
  #panel{
    width:360px;
    flex-shrink:0;
    background:#1b1b22;
    color:#eee;
    padding:24px 20px;
    overflow-y:auto;
    height:100vh;
    position:sticky;
    top:0;
  }
  #panel h1{font-size:18px;margin:0 0 4px;}
  #panel p.sub{font-size:12px;color:#9a9aa5;margin:0 0 6px;}
  #panel p.hint{font-size:11.5px;color:#7d7d89;margin:0 0 18px;line-height:1.5;}
  #panel p.hint code{background:#111117;padding:1px 5px;border-radius:4px;color:#8fd3ff;}
  #panel label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:#9a9aa5;
    margin:16px 0 6px;
  }
  #panel textarea{
    width:100%;
    min-height:130px;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid #34343f;
    background:#111117;
    color:#fff;
    font-size:14px;
    font-family:inherit;
    resize:vertical;
  }
  #panel select{
    width:100%;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid #34343f;
    background:#111117;
    color:#fff;
    font-size:14px;
    font-family:inherit;
  }
  #panel input[type=color]{
    width:44px;height:28px;border:none;border-radius:6px;background:none;padding:0;cursor:pointer;
    vertical-align:middle;
  }
  .color-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .color-row span{font-size:12px;color:#c7c7d0;}
  .range-row{display:flex;align-items:center;gap:10px;}
  .range-row input[type=range]{flex:1;}
  .range-row span{font-size:12px;color:#c7c7d0;min-width:44px;text-align:right;}
  #downloadBtn{
    margin-top:26px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:9px;
    background:#2b56d6;
    color:#fff;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  #downloadBtn:hover{background:#1e42ad;}
  hr{border:none;border-top:1px solid #2c2c36;margin:22px 0;}

  /* ---------- ZONE DE PREVIEW ---------- */
  #stage-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    overflow:auto;
  }
  #canvas{
    width:1200px;
    height:675px;
    transform-origin:center center;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:70px;
    flex-shrink:0;
  }
  #captionText{
    font-family:'Montserrat', sans-serif;
    font-weight:800;
    font-size:46px;
    line-height:1.35;
    color:var(--text);
    text-align:center;
    width:100%;
  }
  #captionText .hl{
    background:var(--hl-bg);
    color:var(--hl-text);
    padding:0 10px;
    border-radius:4px;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
  }
</style>
</head>
<body>

<div id="panel">
  <h1>Générateur de citation</h1>
  <p class="sub">Texte noir/blanc façon capture de citation.</p>
  <p class="hint">Entoure un mot ou un groupe de mots avec <code>==...==</code> pour lui donner un fond en surbrillance (comme "vivrait" dans l'exemple).</p>

  <label for="captionInput">Texte</label>
  <textarea id="captionInput">Gabriel Attal déclare que Stéphane Séjourné, son compagnon, ==vivrait avec lui à l'Élysée s'il était élu.==</textarea>

  <label for="formatSelect">Format</label>
  <select id="formatSelect">
    <option value="1200x675" selected>Paysage — 1200×675</option>
    <option value="1080x1080">Carré — 1080×1080</option>
    <option value="1080x1350">Portrait — 1080×1350</option>
    <option value="1080x1920">Story — 1080×1920</option>
  </select>

  <label for="fontSelect">Police</label>
  <select id="fontSelect">
    <option value="'Montserrat', sans-serif" selected>Montserrat — claire, sérieuse</option>
    <option value="'Inter', sans-serif">Inter — neutre, lisible</option>
    <option value="'Poppins', sans-serif">Poppins — moderne, ronde</option>
    <option value="'Archivo Black', sans-serif">Archivo Black — très épaisse</option>
    <option value="'Anton', sans-serif">Anton — impact affiche</option>
    <option value="'Bebas Neue', sans-serif">Bebas Neue — condensée</option>
    <option value="'Barlow Condensed', sans-serif">Barlow Condensed — presse</option>
    <option value="'Space Grotesk', sans-serif">Space Grotesk — geek chic</option>
    <option value="'Fredoka', sans-serif">Fredoka — ronde et fun</option>
  </select>

  <label for="fontSize">Taille du texte</label>
  <div class="range-row">
    <input type="range" id="fontSize" min="20" max="90" value="46">
    <span id="fontSizeValue">46px</span>
  </div>

  <hr>

  <div class="color-row">
    <span>Fond</span>
    <input type="color" id="colBg" value="#000000">
  </div>
  <div class="color-row">
    <span>Texte</span>
    <input type="color" id="colText" value="#ffffff">
  </div>
  <div class="color-row">
    <span>Fond surbrillance</span>
    <input type="color" id="colHlBg" value="#ffffff">
  </div>
  <div class="color-row">
    <span>Texte surbrillance</span>
    <input type="color" id="colHlText" value="#000000">
  </div>

  <hr>
  <button id="downloadBtn">Télécharger en PNG</button>
</div>

<div id="stage-wrap">
  <div id="canvas">
    <div id="captionText"></div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);

  function escapeHtml(str){
    return str
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  function renderCaption(){
    const raw = $('captionInput').value;
    const escaped = escapeHtml(raw);
    const withHighlights = escaped.replace(/==(.+?)==/gs, '<span class="hl">$1</span>');
    $('captionText').innerHTML = withHighlights.replace(/\n/g, '<br>');
  }

  $('captionInput').addEventListener('input', renderCaption);
  renderCaption();

  $('fontSelect').addEventListener('change', () => {
    $('captionText').style.fontFamily = $('fontSelect').value;
  });

  $('fontSize').addEventListener('input', () => {
    $('captionText').style.fontSize = $('fontSize').value + 'px';
    $('fontSizeValue').textContent = $('fontSize').value + 'px';
  });

  $('colBg').addEventListener('input', e => {
    document.documentElement.style.setProperty('--bg', e.target.value);
  });
  $('colText').addEventListener('input', e => {
    document.documentElement.style.setProperty('--text', e.target.value);
  });
  $('colHlBg').addEventListener('input', e => {
    document.documentElement.style.setProperty('--hl-bg', e.target.value);
  });
  $('colHlText').addEventListener('input', e => {
    document.documentElement.style.setProperty('--hl-text', e.target.value);
  });

  function applyFormat(){
    const [w, h] = $('formatSelect').value.split('x').map(Number);
    const canvas = $('canvas');
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.dataset.w = w;
    canvas.dataset.h = h;
    fitCanvas();
  }
  $('formatSelect').addEventListener('change', applyFormat);

  function fitCanvas(){
    const wrap = document.getElementById('stage-wrap');
    const canvas = document.getElementById('canvas');
    const w = Number(canvas.dataset.w || 1200);
    const h = Number(canvas.dataset.h || 675);
    const scale = Math.min(
      (wrap.clientWidth - 40) / w,
      (wrap.clientHeight - 40) / h
    );
    canvas.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fitCanvas);
  applyFormat();

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const canvas = document.getElementById('canvas');
    const originalTransform = canvas.style.transform;
    const w = Number(canvas.dataset.w || 1200);
    const h = Number(canvas.dataset.h || 675);
    canvas.style.transform = 'none';
    document.fonts.ready.then(() => {
      html2canvas(canvas, {width:w, height:h, scale:1}).then(rendered => {
        canvas.style.transform = originalTransform;
        const link = document.createElement('a');
        link.download = 'citation.png';
        link.href = rendered.toDataURL('image/png');
        link.click();
      });
    });
  });
</script>

</body>
</html>
